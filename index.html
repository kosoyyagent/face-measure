<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Измерение лица по фото — voiceio demo</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --acc:#38bdf8; --txt:#e2e8f0; }
  * { box-sizing:border-box; font-family:'Segoe UI',Arial,sans-serif; }
  body { margin:0; background:var(--bg); color:var(--txt); }
  header { padding:14px 20px; background:var(--panel); display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; font-weight:600; }
  .btn { background:var(--acc); color:#082f49; border:0; border-radius:8px; padding:8px 16px; font-size:14px; cursor:pointer; font-weight:600; }
  .btn.ghost { background:transparent; color:var(--acc); border:1px solid var(--acc); }
  .btn:disabled { opacity:.4; cursor:default; }
  main { display:flex; gap:16px; padding:16px 20px; align-items:flex-start; flex-wrap:wrap; }
  #stage { position:relative; background:#000; border-radius:10px; overflow:hidden; max-width:min(62vw,900px); }
  canvas { display:block; max-width:100%; }
  #side { flex:1; min-width:300px; background:var(--panel); border-radius:10px; padding:14px; max-height:82vh; overflow:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td,th { padding:5px 7px; border-bottom:1px solid #334155; text-align:left; }
  th { color:var(--acc); }
  .tabs { display:flex; gap:6px; }
  .tab { padding:6px 14px; border-radius:8px; background:#334155; cursor:pointer; font-size:13px; }
  .tab.on { background:var(--acc); color:#082f49; font-weight:600; }
  #status { font-size:13px; color:#7dd3fc; }
  .row { display:flex; gap:10px; align-items:center; margin-top:8px; flex-wrap:wrap; }
  label.small { font-size:12px; color:#94a3b8; }
  input[type=number] { width:70px; background:#0f172a; border:1px solid #334155; color:var(--txt); border-radius:6px; padding:4px 6px; }
  #toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#065f46; padding:10px 20px; border-radius:8px; display:none; font-size:14px; }
</style>
</head>
<body>
<header>
  <h1>Антропометрия лица по фото</h1>
  <div class="tabs">
    <div class="tab on" id="tab0">Анфас</div>
    <div class="tab" id="tab1">Профиль</div>
  </div>
  <label class="btn ghost" style="cursor:pointer">Загрузить фото<input id="file" type="file" accept="image/*" hidden></label>
  <button class="btn" id="detect" disabled>Расставить точки (ИИ)</button>
  <button class="btn ghost" id="exportImg" disabled>Экспорт фото</button>
  <button class="btn ghost" id="exportCsv" disabled>Экспорт CSV</button>
</header>
<main>
  <div id="stage"><canvas id="cv" width="800" height="500"></canvas></div>
  <div id="side">
    <div id="status">Загрузите фото анфаса и/или профиля, затем нажмите «Расставить точки».</div>
    <div class="row">
      <label class="small">Межзрачковое расстояние, мм:</label>
      <input type="number" id="ipd" value="63" step="0.5">
      <label class="small">(масштаб для миллиметров)</label>
    </div>
    <table id="tbl"><thead><tr><th>Параметр</th><th>px</th><th>мм</th></tr></thead><tbody></tbody></table>
  </div>
</main>
<div id="toast"></div>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

/* ---- landmark registry: name -> [a,b] indices in Face Mesh 478 ---- */
const POINTS = {
  top:10, chin:152, cheekL:454, cheekR:234, jawL:397, jawR:172,
  foreL:332, foreR:103, irisL:473, irisR:468,
  eyeLout:263, eyeLin:362, eyeLtop:386, eyeLbot:374,
  eyeRin:33, eyeRout:133, eyeRtop:159, eyeRbot:145,
  noseTop:168, noseTip:4, nostrilL:327, nostrilR:98,
  mouthL:291, mouthR:61, lipU:0, lipUin:13, lipD:17, lipDin:14
};
const MEAS = [
  ['Длина лица','top','chin'],
  ['Ширина лица (скулы)','cheekL','cheekR'],
  ['Ширина челюсти','jawL','jawR'],
  ['Ширина лба','foreL','foreR'],
  ['Межзрачковое расст.','irisL','irisR'],
  ['Ширина глаза Л','eyeLout','eyeLin'],
  ['Ширина глаза П','eyeRin','eyeRout'],
  ['Высота глаза Л','eyeLtop','eyeLbot'],
  ['Высота глаза П','eyeRtop','eyeRbot'],
  ['Длина носа','noseTop','noseTip'],
  ['Ширина носа','nostrilL','nostrilR'],
  ['Ширина рта','mouthL','mouthR'],
  ['Верхняя губа','lipU','lipUin'],
  ['Нижняя губа','lipD','lipDin'],
];
const DERIVED = [
  ['Пропорция лица (дл/шир)', v => v[0] && v[1] ? v[0]/v[1] : null],
  ['Угол челюсти, °', null], // filled below with custom fn
];

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const statusEl = document.getElementById('status'), tblBody = document.querySelector('#tbl tbody');
const toast = m => { const t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2200); };

const state = { imgs:[null,null], pts:[null,null], cur:0, fl:null, drag:null, scale:null };

/* ---------- model ---------- */
async function loadModel(){
  if (state.fl) return state.fl;
  statusEl.textContent = 'Загрузка модели MediaPipe…';
  const fileset = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  state.fl = await FaceLandmarker.createFromOptions(fileset, {
    baseOptions:{ modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task' },
    numFaces:1, runningMode:'IMAGE'
  });
  statusEl.textContent = 'Модель готова.';
  return state.fl;
}
loadModel().catch(e=>statusEl.textContent='Модель не загрузилась: '+e.message);

/* ---------- tabs ---------- */
for (const i of [0,1]) document.getElementById('tab'+i).onclick = () => {
  state.cur=i;
  document.getElementById('tab0').classList.toggle('on', i===0);
  document.getElementById('tab1').classList.toggle('on', i===1);
  draw();
};

/* ---------- upload ---------- */
document.getElementById('file').onchange = e => {
  const f=e.target.files[0]; if(!f) return;
  const img=new Image();
  img.onload=()=>{ state.imgs[state.cur]=img; state.pts[state.cur]=null; fitCanvas(img); draw();
    document.getElementById('detect').disabled=false;
    statusEl.textContent='Фото загружено. Нажмите «Расставить точки».'; };
  img.src=URL.createObjectURL(f);
};
function fitCanvas(img){
  const maxW=Math.min(innerWidth*0.62,900), s=Math.min(maxW/img.width,1);
  cv.width=img.width*s; cv.height=img.height*s;
}

/* ---------- detect ---------- */
document.getElementById('detect').onclick = async () => {
  const img=state.imgs[state.cur]; if(!img) return;
  const fl=await loadModel();
  statusEl.textContent='Анализ…';
  await new Promise(r=>setTimeout(r,30));
  const res=fl.detect(img);
  if(!res.faceLandmarks?.length){ statusEl.textContent='Лицо не найдено — попробуйте другое фото.'; return; }
  const lm=res.faceLandmarks[0];
  const pts={};
  for(const [k,idx] of Object.entries(POINTS))
    pts[k]={x:lm[idx].x*cv.width*(img.width/cv.width*cv.width/img.width), y:lm[idx].y*cv.height};
  // normalized coords are relative to the ORIGINAL image; scale to canvas
  for(const [k,idx] of Object.entries(POINTS))
    pts[k]={x:lm[idx].x*cv.width, y:lm[idx].y*cv.height};
  state.pts[state.cur]=pts; draw(); measure();
  document.getElementById('exportImg').disabled=false;
  document.getElementById('exportCsv').disabled=false;
  statusEl.textContent='Точки расставлены. Любую можно перетащить — измерения пересчитаются.';
};

/* ---------- draw ---------- */
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  const img=state.imgs[state.cur];
  if(!img){ ctx.fillStyle='#000'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle='#64748b'; ctx.font='18px sans-serif'; ctx.textAlign='center';
    ctx.fillText('Нет фото', cv.width/2, cv.height/2); return; }
  ctx.drawImage(img,0,0,cv.width,cv.height);
  const pts=state.pts[state.cur]; if(!pts) return;
  for(const [,a,b] of MEAS){
    line(pts[a],pts[b],'rgba(56,189,248,.55)');
  }
  for(const k in pts) dot(pts[k], k===state.drag?'#f472b6':'#38bdf8');
  // labels on a few anchors
  ctx.font='10px sans-serif'; ctx.fillStyle='#bae6fd';
  for(const k of ['top','chin','noseTip']) ctx.fillText(k,pts[k].x+6,pts[k].y-6);
}
function line(a,b,c){ ctx.strokeStyle=c; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
function dot(p,c){ ctx.fillStyle=c; ctx.beginPath(); ctx.arc(p.x,p.y,3.4,0,7); ctx.fill(); }

/* ---------- measure ---------- */
const D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function angle(a,b,c){ // angle ABC in degrees
  const v1={x:a.x-b.x,y:a.y-b.y},v2={x:c.x-b.x,y:c.y-b.y};
  const cos=(v1.x*v2.x+v1.y*v2.y)/(Math.hypot(v1.x,v1.y)*Math.hypot(v2.x,v2.y));
  return Math.acos(Math.min(1,Math.max(-1,cos)))*180/Math.PI;
}
function measure(){
  const pts=state.pts[state.cur]; if(!pts) return;
  const vals=MEAS.map(([,a,b])=>D(pts[a],pts[b]));
  const ipd=D(pts.irisL,pts.irisR);
  state.scale=(document.getElementById('ipd').value||63)/ipd; // mm per px
  const rows=[...MEAS.map(([n],i)=>[n,vals[i]])];
  rows.push(['Пропорция лица (дл/шир)', null, vals[1]?(vals[0]/vals[1]).toFixed(2):'—']);
  rows.push(['Угол челюсти Л, °', null, angle(pts.cheekL,pts.jawL,pts.chin).toFixed(1)]);
  rows.push(['Угол челюсти П, °', null, angle(pts.cheekR,pts.jawR,pts.chin).toFixed(1)]);
  tblBody.innerHTML=rows.map(([n,px,d])=>
    `<tr><td>${n}</td><td>${px!==null?px.toFixed(1):d}</td><td>${px!==null?(px*state.scale).toFixed(1):'—'}</td></tr>`).join('');
}
document.getElementById('ipd').oninput=measure;

/* ---------- drag ---------- */
cv.addEventListener('mousedown',e=>{
  const pts=state.pts[state.cur]; if(!pts) return;
  const r=cv.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
  let best=null,bd=14;
  for(const k in pts){const d=Math.hypot(pts[k].x-mx,pts[k].y-my); if(d<bd){bd=d;best=k;}}
  state.drag=best;
});
cv.addEventListener('mousemove',e=>{
  if(!state.drag) return;
  const r=cv.getBoundingClientRect(), pts=state.pts[state.cur];
  pts[state.drag].x=e.clientX-r.left; pts[state.drag].y=e.clientY-r.top;
  draw(); measure();
});
addEventListener('mouseup',()=>state.drag=null);

/* ---------- export ---------- */
document.getElementById('exportImg').onclick=()=>{
  const a=document.createElement('a'); a.download='face_points.png'; a.href=cv.toDataURL('image/png'); a.click(); toast('Фото сохранено');
};
document.getElementById('exportCsv').onclick=()=>{
  const rows=[['param','px','mm'],...[...tblBody.querySelectorAll('tr')].map(tr=>[...tr.children].map(td=>td.textContent))];
  const csv=rows.map(r=>r.map(c=>`"${c}"`).join(',')).join('\r\n');
  const a=document.createElement('a'); a.download='measurements.csv';
  a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'})); a.click(); toast('CSV сохранён');
};
draw();
</script>
</body>
</html>
